</head>

<body>

<h1>Status Server Dashboard</h1>

<h2>Cluster Status</h2>
<div class="container" id="statusContainer"></div>

<h2>User Status Messages</h2>
<div class="container" id="userStatusContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

<script>

    const statusMap = {};
    const userStatuses = [];

    async function loadInitialData() {

        try {

            const response = await fetch('/status');
            const data = await response.json();

            data.forEach(status => {
                statusMap[status.nodeId] = status.state;
            });

            renderClusterStatus();

        } catch (error) {

            console.error(
                "Fehler beim Laden der Clusterdaten:",
                error
            );
        }
    }

    async function loadUserStatuses() {

        try {

            const response = await fetch('/userstatus');
            const data = await response.json();

            userStatuses.length = 0;

            data.forEach(status => {
                userStatuses.push(status);
            });

            renderUserStatuses();

        } catch (error) {

            console.error(
                "Fehler beim Laden der UserStatus:",
                error
            );
        }
    }

    const socket = new SockJS('/ws');
    const stompClient = Stomp.over(socket);

    stompClient.connect({}, function () {

        console.log("WebSocket verbunden");

        loadInitialData();
        loadUserStatuses();

        stompClient.subscribe('/topic/status', function (message) {

            const status = JSON.parse(message.body);

            statusMap[status.nodeId] = status.state;

            renderClusterStatus();
        });

        /*
        Enable later if you broadcast UserStatus updates:

        stompClient.subscribe('/topic/userstatus', function (message) {

            const status = JSON.parse(message.body);

            userStatuses.push(status);

            renderUserStatuses();
        });
        */
    });

    function renderClusterStatus() {

        const container =
            document.getElementById("statusContainer");

        container.innerHTML = "";

        for (const node in statusMap) {

            const div = document.createElement("div");

            div.classList.add("node");

            const state = statusMap[node];

            div.classList.add(state);

            div.innerText = node + " → " + state;

            container.appendChild(div);
        }
    }

    function renderUserStatuses() {

        const container =
            document.getElementById("userStatusContainer");

        container.innerHTML = "";

        userStatuses.forEach(status => {

            const div = document.createElement("div");

            div.classList.add(
                "node",
                "user-status"
            );

            div.innerHTML = `
                <div>
                    <strong>${status.username}</strong>
                </div>

                <div>
                    ${status.statusText}
                </div>

                <small>
                    ${status.timestamp}
                </small>

                <small>
                    Latitude: ${status.latitude}
                    |
                    Longitude: ${status.longitude}
                </small>
            `;

            container.appendChild(div);
        });
    }

</script>

</body>
</html>
