<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Status Server Dashboard</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
        }
        h1 { text-align: center; }
        h2 { margin-top: 30px; }
        .layout { max-width: 1000px; margin: auto; }
        #map {
            height: 500px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }
        .node {
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            color: white;
            font-weight: bold;
        }
        .ONLINE  { background-color: #2ecc71; }
        .OFFLINE { background-color: #e74c3c; }
        .ERROR   { background-color: #f39c12; }
    </style>
</head>

<body>

<div class="layout">
    <h1>Status Server Dashboard</h1>

    <h2>Message Map</h2>
    <div id="map"></div>

    <h2>Cluster Status</h2>
    <div id="statusContainer"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

<script>

    // ---------- Map ----------

    const map = L.map('map').setView([47.84, 16.52], 7);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const markers = {};   // id -> L.marker

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function popupHtml(s) {
        return `<strong>${escapeHtml(s.username)}</strong><br>`
            + `${escapeHtml(s.statusText)}<br>`
            + `<small>${escapeHtml(s.timestamp)}</small>`;
    }

    function upsertMarker(s) {
        if (s.latitude == null || s.longitude == null) {
            return;
        }
        if (markers[s.id]) {
            markers[s.id].setLatLng([s.latitude, s.longitude]).setPopupContent(popupHtml(s));
        } else {
            markers[s.id] = L.circleMarker([s.latitude, s.longitude], {
                radius: 9,
                color: '#1f4e79',
                weight: 2,
                fillColor: '#3498db',
                fillOpacity: 0.9
            }).addTo(map).bindPopup(popupHtml(s));
        }
    }

    function removeMarker(id) {
        if (markers[id]) {
            map.removeLayer(markers[id]);
            delete markers[id];
        }
    }

    // One status update (from REST load or a WebSocket push): add, move, or remove it.
    function applyUserStatus(s) {
        if (s.deleted) {
            removeMarker(s.id);
        } else {
            upsertMarker(s);
        }
    }

    // ---------- Cluster status panel ----------

    const statusMap = {};   // nodeId -> state

    function renderClusterStatus() {
        const container = document.getElementById("statusContainer");
        container.innerHTML = "";
        for (const node in statusMap) {
            const div = document.createElement("div");
            div.classList.add("node", statusMap[node]);
            div.innerText = node + " → " + statusMap[node];
            container.appendChild(div);
        }
    }

    // ---------- Initial load over REST ----------

    async function loadMessages() {
        try {
            (await (await fetch('/messages')).json()).forEach(applyUserStatus);
        } catch (e) {
            console.error("Failed to load messages:", e);
        }
    }

    async function loadClusterStatus() {
        try {
            (await (await fetch('/status')).json()).forEach(s => statusMap[s.nodeId] = s.state);
            renderClusterStatus();
        } catch (e) {
            console.error("Failed to load cluster status:", e);
        }
    }

    // ---------- Live updates over native WebSocket ----------

    const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    const stompClient = Stomp.client(wsProtocol + window.location.host + '/ws');
    stompClient.debug = function () {};

    stompClient.connect({}, function () {
        console.log("WebSocket connected");
        loadMessages();
        loadClusterStatus();

        stompClient.subscribe('/topic/userstatus', function (m) {
            applyUserStatus(JSON.parse(m.body));
        });

        stompClient.subscribe('/topic/status', function (m) {
            const s = JSON.parse(m.body);
            statusMap[s.nodeId] = s.state;
            renderClusterStatus();
        });
    });

</script>

</body>
</html>
